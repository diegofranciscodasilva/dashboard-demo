<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Widget de vendas</title>
    <style>
        body {
            margin: 0;
            padding: 12px;
            font-family: system-ui, "Segoe UI", sans-serif;

            background: {
                    {
                    '#1e293b' if tema=='dark' else '#ffffff'
                }
            }

            ;

            color: {
                    {
                    '#e2e8f0' if tema=='dark' else '#1f2937'
                }
            }

            ;
        }

        h4 {
            margin: 0 0 4px;
        }

        #total {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .area {
            position: relative;
            height: 200px;
        }
    </style>
</head>

<body>
    <h4>Vendas dos últimos 6 meses</h4>
    <div id="total">--</div>
    <div class="area"><canvas id="g" role="img" aria-label="Barras com vendas dos últimos meses"></canvas></div>

    <script src="{{ url_for('static', filename='vendor/chart.umd.js') }}"></script>
    <script>window.Chart || document.write('<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.js"><\/script>')</script>
    <script>
        const escuro = "{{ tema }}" === "dark";
        const total = document.getElementById("total");

        fetch("/api/analitico")
            .then((r) => { if (!r.ok) throw new Error(); return r.json(); })
            .then((d) => {
                const ultimos = d.mensal.slice(-6);
                const soma = ultimos.reduce((s, m) => s + m.total, 0);
                total.textContent = soma.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

                Chart.defaults.color = escuro ? "#e2e8f0" : "#1f2937";
                Chart.defaults.borderColor = escuro ? "#334155" : "#e5e7eb";
                new Chart(document.getElementById("g"), {
                    type: "bar",
                    data: {
                        labels: ultimos.map((m) => m.mes),
                        datasets: [{ data: ultimos.map((m) => m.total), backgroundColor: "#2563eb" }]
                    },
                    options: { maintainAspectRatio: false, plugins: { legend: { display: false } } },
                });
            })
            .catch(() => { total.textContent = "Dados indisponíveis"; });
    </script>
</body>

</html>
