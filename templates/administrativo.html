{% extends "base.html" %}
{% block conteudo %}
<h1>Painel Administrativo</h1>
<p class="sub">Cadastro e gestão de usuários (CRUD) em modo demonstração.</p>

<form id="form-usuario" class="card filtros">
    <label>Nome <input name="nome" required maxlength="80"></label>
    <label>E-mail <input name="email" type="email" required maxlength="120"></label>
    <label>Perfil
        <select name="perfil">
            <option>Administrador</option>
            <option>Editor</option>
            <option>Leitor</option>
        </select>
    </label>
    <button class="btn" type="submit">Adicionar</button>
    <span id="msg" class="neg" role="alert"></span>
</form>

<div class="card tabela">
    <table id="tabela-usuarios">
        <thead>
            <tr>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Perfil</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>
{% endblock %}
